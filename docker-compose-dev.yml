version: '3.8'

networks:
  id-network-dev:
    driver: bridge

volumes:
  id-pg-volume-dev:
  id-redis-volume-dev:
  id-rabbitmq-volume-dev:

services:
  # 1. PostgreSQL Database
  db:
    container_name: id-database-pg-dev
    image: postgres:15.2
    restart: always
    env_file:
      - .env
    networks:
      - id-network-dev
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-base_db}
    volumes:
      - id-pg-volume-dev:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"

  # 2. Redis Cache & Distributed Lock
  redis:
    container_name: id-redis-dev
    image: redis:7.2.4
    restart: always
    env_file:
      - .env
    networks:
      - id-network-dev
    volumes:
      - id-redis-volume-dev:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"

  # 3. RabbitMQ Transactional Queue (AMQP 5672 + Management UI 15672)
  rabbitmq:
    container_name: id-rabbitmq-dev
    image: rabbitmq:3.13-management-alpine
    restart: always
    env_file:
      - .env
    networks:
      - id-network-dev
    volumes:
      - id-rabbitmq-volume-dev:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}

  # 4. Apache Kafka (KRaft Mode - No ZooKeeper needed, JVM limited to 512MB)
  kafka:
    container_name: id-kafka-dev
    image: apache/kafka:3.7.0
    restart: always
    networks:
      - id-network-dev
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_JVM_PERFORMANCE_OPTS: "-Xms256m -Xmx512m"

  # 5. Centrifugo Realtime Engine (Go-based, ultra-light ~30MB RAM)
  centrifugo:
    container_name: id-centrifugo-dev
    image: centrifugo/centrifugo:v5
    restart: always
    networks:
      - id-network-dev
    volumes:
      - ./centrifugo.json:/centrifugo/config.json
    command: centrifugo -c /centrifugo/config.json
    ports:
      - "${CENTRIFUGO_PORT:-8001}:8000"
    environment:
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-fintrade-centrifugo-api-key}
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_SECRET:-fintrade-centrifugo-hmac-secret-key}
      CENTRIFUGO_ADMIN_PASSWORD: ${CENTRIFUGO_ADMIN_PASSWORD:-Admin@123}
      CENTRIFUGO_ADMIN_SECRET: ${CENTRIFUGO_ADMIN_SECRET:-fintrade-centrifugo-admin-secret}
